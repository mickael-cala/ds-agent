name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Versions : la CI utilise le dernier correctif de Go 1.27 (>= 1.27.4) car les
# vulnérabilités signalées par govulncheck étaient dans la bibliothèque standard
# de 1.27.1. Le poste de développement (Termux/android-arm64) reste en 1.27.3,
# version fournie par Termux — d'où GOTOOLCHAIN=local dans les scripts locaux.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Qualité (linux, -race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Format (gofmt)
        run: |
          test -z "$(gofmt -l .)" || { echo "fichiers à formater :"; gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Aucun secret versionné
        run: bash scripts/check-secrets.sh

      - name: Tests unitaires (race)
        run: go test -race -count=1 ./...

      - name: Tests du sous-projet audit_api
        run: cd audit_api && go test -race -count=1 ./...

      - name: Banc hostile (mock deepseek)
        run: bash tests/paranoid.sh

      - name: Test bout-en-bout du REPL
        run: bash tests/e2e.sh

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Compilation
        run: go build ./...

      - name: Binaire versionné (linux)
        if: runner.os == 'Linux'
        run: go build -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o ds-agent ./cmd/ds-agent

      - name: Vérification du binaire (linux)
        if: runner.os == 'Linux'
        run: ./ds-agent --version

  vulnerabilites:
    name: Vulnérabilités (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
